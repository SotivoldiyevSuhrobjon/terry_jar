<title>Terry Jar Perixod</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
/* Layout: chap tomonda navigatsiya (telefonda chiqib-yashirinadigan), o'ngda ish maydoni; 3D faqat banner, login va stanok taxtasida */
:root{
  --x-q:#92d050; --x-des:#c4bd97; --x-in:#c5d9f1; --x-kg:#ffff00; --x-pc:#92cddc; --x-sz:#fabf8f; --x-gr:#bfbfbf; --x-sana:#e00000;
  --bg:#eceef6; --surface:#ffffff; --surface2:#f4f5fb; --line:#d9dcec; --ink:#121640; --muted:#5a6087;
  --navy:#1b2190; --accent:#2b33c2; --accent-ink:#ffffff; --teal:#11807b; --violet:#5b50cf;
  --ok:#157647; --okbg:#e2f3e9; --warn:#a86400; --warnbg:#fff0d6; --bad:#bf2f3a; --badbg:#fde5e7;
  --plate:#ffffff; --paper:#ffffff; --paper-ink:#111111;
  --t-salfetka:#7b70ee; --t-sredni:#2b33c2; --t-banni:#11807b; --t-sauna:#b4573b; --t-polotno:#7d8420;
  --sh1:0 1px 0 rgba(18,22,64,.05),0 12px 28px -14px rgba(27,33,144,.28);
  --sh2:0 2px 0 rgba(18,22,64,.06),0 26px 50px -22px rgba(27,33,144,.45);
  --f-brand:'Cinzel',Georgia,'Times New Roman',serif;
  --f-ui:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090c20; --surface:#11153a; --surface2:#171c47; --line:#272d63; --ink:#e8eafb; --muted:#9ba1d0;
  --navy:#cdd0ff; --accent:#8d95ff; --accent-ink:#0b0e2a; --teal:#4ac7bf; --violet:#aa9fff;
  --ok:#52d08d; --okbg:#0f2e1e; --warn:#f2b44e; --warnbg:#33260b; --bad:#ff6f79; --badbg:#3a1419;
  --plate:#f3f4fb; --t-salfetka:#a69dff; --t-sredni:#8d95ff; --t-banni:#4ac7bf; --t-sauna:#ff9c7a; --t-polotno:#d2d867;
  --sh1:0 1px 0 rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.7);
  --sh2:0 2px 0 rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.85);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090c20; --surface:#11153a; --surface2:#171c47; --line:#272d63; --ink:#e8eafb; --muted:#9ba1d0;
  --navy:#cdd0ff; --accent:#8d95ff; --accent-ink:#0b0e2a; --teal:#4ac7bf; --violet:#aa9fff;
  --ok:#52d08d; --okbg:#0f2e1e; --warn:#f2b44e; --warnbg:#33260b; --bad:#ff6f79; --badbg:#3a1419;
  --plate:#f3f4fb; --t-salfetka:#a69dff; --t-sredni:#8d95ff; --t-banni:#4ac7bf; --t-sauna:#ff9c7a; --t-polotno:#d2d867;
  --sh1:0 1px 0 rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.7);
  --sh2:0 2px 0 rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.85);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.m{color:var(--muted)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons & inputs */
.btn{color:var(--ink);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh1)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000),0 10px 20px -10px var(--accent)}
.btn.p:active{box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.t{background:var(--teal);color:#fff;border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--teal) 55%,#000)}
.btn.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.d.on{background:var(--bad);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn svg{width:16px;height:16px;flex:none}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.in:disabled{opacity:.55;cursor:not-allowed}
.in.big{font-family:var(--f-num);font-size:20px;font-weight:600;padding:10px 12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.n{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.pill.a{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.neg{color:var(--bad)}.pos{color:var(--ok)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .plate{width:46px;height:46px;border-radius:12px;background:var(--plate);display:grid;place-items:center;box-shadow:var(--sh1);transform:perspective(200px) rotateY(-12deg);flex:none}
.brand .plate img{width:38px}
.brand b{font-family:var(--f-brand);font-size:15px;letter-spacing:.14em;line-height:1.05;display:block;color:var(--navy)}
.brand small{font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--muted);border:0;background:none;width:100%;text-align:left;position:relative}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-weight:600}
.nav .bdg{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}
.navsec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 11px 4px;font-weight:600}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 2px;display:flex;flex-direction:column;gap:8px}
.ava{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:linear-gradient(145deg,var(--accent),var(--violet));color:#fff;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top h1{font-size:19px;font-weight:700}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 5px}
.menu-btn{display:none}
.view{padding-block:18px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1360px;width:100%}
.scrim{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.raise{box-shadow:var(--sh1)}
.card h2{font-size:16px;font-weight:700}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td.num,td .num{font-family:var(--f-num)}

/* 3D tilt */
.tilt{transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .25s}
.tilt:hover{box-shadow:var(--sh2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh1)}
.kpi .v{font-family:var(--f-num);font-size:26px;font-weight:600;margin-top:6px;transform:translateZ(30px);letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px;transform:translateZ(16px)}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--k,var(--accent)) 40%,transparent),transparent 70%)}

/* hero banner */
.hero{position:relative;overflow:hidden;border-radius:20px;min-height:200px;background:
  radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--violet) 30%,transparent),transparent 55%),
  radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--teal) 34%,transparent),transparent 60%),
  linear-gradient(135deg,#141a78,#0c1050);color:#fff;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);box-shadow:var(--sh2)}
.hero .txt{padding:22px 24px;display:flex;flex-direction:column;gap:10px;z-index:2;min-width:0}
.hero .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.75}
.hero h2{font-family:var(--f-brand);font-size:clamp(22px,3vw,32px);letter-spacing:.12em;font-weight:700}
.hero p{margin:0;opacity:.85;max-width:52ch}
.hero canvas{width:100%;height:100%;display:block;position:absolute;inset:0}
.hero .c3{position:relative;min-height:200px}
.hero .group{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.hero .group span{background:rgba(255,255,255,.94);border-radius:10px;padding:5px 9px;display:grid;place-items:center;height:42px;box-shadow:0 8px 18px -8px rgba(0,0,0,.6);transform:perspective(300px) rotateX(8deg)}
.hero .group img{height:30px;width:auto;max-width:none}

/* loom board */
.board{perspective:2600px}
.board .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;transform-style:preserve-3d;transition:transform .5s}
.board.d3 .tiles{transform:rotateX(12deg);transform-origin:50% 0}
.tile{position:relative;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:7px 7px 6px;cursor:pointer;text-align:left;min-height:66px;display:flex;flex-direction:column;gap:2px;transform-style:preserve-3d;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 0 color-mix(in srgb,var(--line) 90%,#000 10%)}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:10px 10px 0 0;background:var(--tc,var(--muted))}
.board.d3 .tile.run{transform:translateZ(10px)}
.tile:hover{transform:translateZ(18px) translateY(-2px)!important;box-shadow:0 10px 18px -6px rgba(0,0,0,.35)}
.tile .no{font-family:var(--f-num);font-weight:600;font-size:15px}
.tile .ds{font-size:10.5px;color:var(--muted);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .kg{font-family:var(--f-num);font-size:11px;color:var(--teal);margin-top:auto}
.tile.sel{outline:2.5px solid var(--accent);outline-offset:1px;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.tile.off{opacity:.45}
.tile .chk{position:absolute;right:6px;top:8px;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted)}
.tile.pick .chk{background:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* val rolls */
.rolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.roll{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 10px 9px;cursor:pointer;text-align:left;display:flex;gap:9px;align-items:center;transition:transform .18s,box-shadow .18s;min-width:0}
.roll:hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.roll.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--sh2);transform:translateY(-3px)}
.cyl{width:30px;height:38px;flex:none;position:relative;border-radius:6px/4px;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 4px),
  linear-gradient(90deg,color-mix(in srgb,var(--rc) 70%,#000),var(--rc) 35%,color-mix(in srgb,var(--rc) 60%,#fff) 55%,var(--rc) 75%,color-mix(in srgb,var(--rc) 65%,#000))}
.cyl::before{content:"";position:absolute;left:0;right:0;top:-5px;height:10px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 40%,#fff) 0 18%,color-mix(in srgb,var(--rc) 80%,#000) 19% 26%,color-mix(in srgb,var(--rc) 55%,#fff) 27% 100%)}
.cyl::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--rc) 70%,#000);z-index:-1}
.roll .k{font-family:var(--f-num);font-weight:600;font-size:15px}
.roll .i{font-size:11.5px;color:var(--muted);line-height:1.25}

/* sticky summary */
.sumbar{position:sticky;bottom:12px;z-index:20;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh2)}
.sumbar .num{font-size:18px;font-weight:600}
.sumbar .lbl{color:color-mix(in srgb,var(--bg) 70%,transparent)}

/* passport list */
.pl{display:grid;gap:10px}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pno{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:17px;background:linear-gradient(150deg,var(--surface2),var(--surface));border:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--line)}
.pno small{display:block;font-size:9px;color:var(--muted);letter-spacing:.1em;margin-top:-6px}
.steps{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--teal)}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(6,8,30,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 30px max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border-radius:18px;width:min(860px,100%);box-shadow:var(--sh2);display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mbody{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:26px 28px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 30px 50px -28px rgba(0,0,0,.6);transform:perspective(1600px) rotateX(3deg);transform-origin:50% 0;overflow-x:auto}
.sheet table{font-size:12.5px;color:#111}
.sheet th{background:#eef0f5;color:#333;position:static}
.sheet th,.sheet td{border:1px solid #c7cad6;padding:5px 7px}
.ph{display:flex;align-items:center;gap:16px;border-bottom:2px solid #1b2190;padding-bottom:10px;margin-bottom:12px}
.ph img{height:54px}
.ph .t{font-family:var(--f-brand);font-size:20px;letter-spacing:.1em;color:#1b2190;font-weight:700}
.pmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;font-size:12.5px;margin-bottom:12px}
.pmeta b{display:block;font-size:13.5px}
.psum{margin-top:10px;font-weight:700;font-size:13.5px;border:2px solid #111;padding:7px 10px;display:flex;gap:18px;flex-wrap:wrap}
.psig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:28px;font-size:12.5px}
.psig div{border-top:1px solid #111;padding-top:4px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .sheet{box-shadow:none;transform:none;padding:0}
}

/* login */
.login{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);background:linear-gradient(140deg,#0b0f47,#141a78 55%,#0d3f55);color:#fff;overflow:auto}
.login canvas{position:absolute;inset:0;width:100%;height:100%}
.lpanel{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:30px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.lcard{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;transform:perspective(1200px) rotateY(6deg);transition:transform .4s}
.lcard:hover{transform:perspective(1200px) rotateY(0deg)}
.lbrand{display:flex;flex-direction:column;gap:10px;max-width:420px}
.lbrand .pl8{background:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 24px 50px -24px rgba(0,0,0,.8);transform:perspective(900px) rotateX(10deg) rotateY(-8deg)}

/* RASXOD: filiallardan val qabul — Jar / Tuya to'ydi / Shtf / Uychi perixodidan kelgan vallar tekshiriladi, keyin mashinaga yuklanadi */
const rxSrc=(br=BR())=>S.branches.filter(b=>(b.rxTo||b.id)==br).map(b=>b.id);
const rxPool=()=>{const src=rxSrc();return S.vals.filter(v=>src.includes(v.br))};
const brShort=id=>{const b=S.branches.find(x=>x.id==id)||{};return b.short||b.name||id};
const vcode=v=>v.br==BR()?v.code:brShort(v.br)+' '+v.code;
const VST={free:['rasxod qabulini kutmoqda','n'],rx:['rasxod qabul qildi','a'],pass:['mashinada','ok']};
const vPill=v=>`<span class="pill ${VST[v.st][1]}">${VST[v.st][0]}</span>${v.miss?' <span class="pill bad">yetib kelmagan</span>':''}`;
function qabulView(){
 const inc=rxPool().filter(v=>v.st=='free'),ed=can('rx'),src=rxSrc();
 if(!ui.rq)ui.rq=[];
 const byB={};inc.forEach(v=>{(byB[v.br]=byB[v.br]||{});(byB[v.br][v.date]=byB[v.br][v.date]||[]).push(v)});
 return `<div class="card"><div class="card-h"><h2>Val qabul</h2><span class="m" style="font-size:12.5px">${src.map(id=>esc((S.branches.find(b=>b.id==id)||{}).name)).join(' · ')} perixodidan kelgan vallar. Har birini tekshirib belgilang, tarozida qayta tortilgan kg ni yozing va qabul qiling — shundan keyin mashinaga yuklash mumkin.</span></div>
  ${ed?`<form class="row" onsubmit="event.preventDefault();rqScan()" style="gap:8px"><select class="in" id="rqb" style="width:auto" aria-label="Filial">${src.map(id=>`<option value="${id}" ${ui.rqB==id?'selected':''}>${esc(brShort(id))} — ${esc((S.branches.find(b=>b.id==id)||{}).name)}</option>`).join('')}</select><input class="in num" id="rqc" placeholder="Val raqami: 115/12 — Enter" style="flex:1;min-width:160px" autocomplete="off"><button class="btn">${ic('check')} Belgilash</button></form>`:''}</div>
 ${Object.keys(byB).length?Object.entries(byB).map(([br,days])=>{const b=S.branches.find(x=>x.id==br)||{};return `<div class="card"><div class="card-h"><span class="bno">${esc(brShort(br))}</span><div><h2>${esc(b.name)}</h2><div class="m" style="font-size:12.5px">${Object.values(days).flat().length} val kutilmoqda · ${N(sum(Object.values(days).flat(),v=>calc(v).net),1)} kg</div></div></div>
  ${Object.entries(days).sort((a,c)=>a[0]<c[0]?-1:1).map(([day,vs])=>{const all=S.vals.filter(v=>v.br==br&&v.date==day),done=all.filter(v=>v.st!='free').length,gid=br+'_'+day;
   vs.sort((a,c)=>a.loom-c.loom||(a.code<c.code?-1:1));
   return `<details open class="rqg"><summary><b>${fd(day)}</b> <span class="m">perixod: ${all.length} val · ${N(sum(all,v=>calc(v).net),1)} kg — qabul qilingan: ${done}, kutilmoqda: ${vs.length}</span> ${done==all.length?'<span class="pill ok">to\'liq</span>':''}</summary>
   <div class="tw" style="margin-top:8px"><table><thead><tr><th>${ed?`<input type="checkbox" aria-label="Hammasini belgilash" onchange="rqAll('${gid}',this.checked)">`:''}</th><th class="l">Val</th><th class="l">Smena</th><th class="l">Dizayn</th><th>Perixod KG</th><th>Dona</th><th>Brak</th><th>Qabul KG</th><th class="l">Holat</th></tr></thead><tbody>
   ${vs.map(v=>{const c=calc(v);return `<tr data-g="${gid}"><td>${ed?`<input type="checkbox" class="rqk" data-id="${v.id}" ${ui.rq.includes(v.id)?'checked':''} onchange="rqTog('${v.id}',this.checked)" aria-label="${esc(v.code)} keldi">`:''}</td><td class="l num"><b>${esc(v.code)}</b></td><td class="l">${SHL[v.shift]} · ${valBg(v)}</td><td class="l">${esc((desObj(v.des)||{}).name)}</td><td class="num">${N(c.net,1)}</td><td class="num">${N(c.pcs,0)}</td><td class="num">${v.brak||''}</td><td>${ed?`<input class="in num" id="rk_${v.id}" style="width:86px;text-align:right;padding:4px 7px" value="${N(c.net,1).replace(/\s/g,'')}" inputmode="decimal" aria-label="Qabul kg ${esc(v.code)}">`:''}</td><td class="l">${v.miss?'<span class="pill bad">yetib kelmagan</span>':'<span class="pill n">kutilmoqda</span>'}</td></tr>`}).join('')}</tbody></table></div>
   ${ed?`<div class="row" style="margin-top:8px"><button class="btn t sm" onclick="rqAccept('${gid}')">${ic('check')} Belgilanganlarni qabul qilish</button><button class="btn sm d" onclick="rqMiss('${gid}')">Belgilanmaganlar yetib kelmadi</button></div>`:''}</details>`}).join('')}</div>`}).join(''):'<div class="empty">Hozircha qabul kutayotgan val yo\'q</div>'}`;
}
function rqTog(id,on){if(!ui.rq)ui.rq=[];const i=ui.rq.indexOf(id);if(on&&i<0)ui.rq.push(id);if(!on&&i>=0)ui.rq.splice(i,1)}
function rqAll(gid,on){$$(`tr[data-g="${gid}"] .rqk`).forEach(c=>{c.checked=on;rqTog(c.dataset.id,on)})}
function rqScan(){const br=$('#rqb').value,code=$('#rqc').value.trim().replace(/\s/g,'');ui.rqB=br;if(!code)return;
 const v=rxPool().find(x=>x.br==br&&x.code==code);if(!v){toast(`${brShort(br)} ${code} — bunday val yo'q`);return}
 if(v.st!='free'){toast(`${brShort(br)} ${code} allaqachon qabul qilingan`);return}
 const c=$(`.rqk[data-id="${v.id}"]`);if(c)c.checked=true;rqTog(v.id,true);toast(`${brShort(br)} ${code} belgilandi`);$('#rqc').value='';$('#rqc').focus();
 const row=c&&c.closest('tr');if(row){row.classList.add('flash');row.scrollIntoView({block:'nearest'});setTimeout(()=>row.classList.remove('flash'),900)}}
function rqAccept(gid){const ids=$$(`tr[data-g="${gid}"] .rqk`).filter(c=>c.checked).map(c=>c.dataset.id);if(!ids.length){toast('Avval kelgan vallarni belgilang');return}
 const diff=[];let kg=0;ids.forEach(id=>{const v=S.vals.find(x=>x.id==id),el=$('#rk_'+id),k=el?parseFloat(el.value.replace(',','.')):calc(v).net,net=calc(v).net;
  v.st='rx';v.miss=false;v.rq={t:nowS(),by:me.name,kg:isNaN(k)?net:k};kg+=v.rq.kg;if(Math.abs(v.rq.kg-net)>=0.3)diff.push(`${v.code}: ${N(net,1)} → ${N(v.rq.kg,1)} kg`)});
 ui.rq=ui.rq.filter(x=>!ids.includes(x));const br=gid.split('_')[0];
 notify(br,['planner','perixod'],`Rasxod ${ids.length} ta valni qabul qildi (${N(kg,1)} kg)`,'ok');
 if(diff.length)notify(br,['planner','boss'],`Rasxod qabulida kg farqi: ${diff.join('; ')}`,'warn');
 logA(`Val qabul: ${brShort(br)} ${ids.length} val, ${N(kg,1)} kg${diff.length?' (farq bor)':''}`);save();toast(`${ids.length} ta val qabul qilindi — endi mashinaga yuklash mumkin`);render()}
function rqMiss(gid){const rows=$$(`tr[data-g="${gid}"] .rqk`).filter(c=>!c.checked).map(c=>S.vals.find(v=>v.id==c.dataset.id));if(!rows.length){toast('Hammasi belgilangan');return}
 rows.forEach(v=>v.miss=true);const br=gid.split('_')[0];
 notify(br,['planner','boss','perixod'],`Rasxodga ${rows.length} ta val yetib kelmadi: ${rows.map(v=>v.code).join(', ')}`,'bad');
 logA(`Val qabul: ${brShort(br)} ${rows.length} ta val yetib kelmadi (${rows.map(v=>v.code).join(', ')})`);save();toast(`${rows.length} ta val «yetib kelmagan» deb belgilandi, perixodga xabar ketdi`);render()}

/* ---------- keyingi glatka (rulon rejasi): zakaz qoldig'i stanoklar soniga bo'linadi, val ≤ 62,5 kg ---------- */
const EDIT_MIN=30;
function canEditVal(v){if(!v||v.st=='pass'||isClosed('per',vM(v)))return false;if(can('per_tahrir'))return true;if(v.st!='free')return false;return can('per_kirit')&&v.by==me.name&&v.ts&&Date.now()-v.ts<EDIT_MIN*60e3}
const editLeft=v=>v.ts?Math.max(0,Math.ceil((EDIT_MIN*60e3-(Date.now()-v.ts))/60e3)):0;
function rollPlan(share,gl,pk){const mx=+S.cfg.rollMax||62.5,maxR=Math.max(1,Math.floor(mx/(pk*gl))),n=Math.max(1,Math.ceil(share/(maxR*gl)));let left=share;const pl=[];for(let i=n;i>0&&left>0;i--){const per=left/i,rows=Math.max(1,Math.min(maxR,Math.ceil(per/gl))),p=Math.min(rows*gl,left);pl.push({rows,p,kg:p*pk});left-=p}return pl}
function rollInfo(n,d){if(!d||!d.qty)return null;const z=zRow(d),lmS=z.looms.length?z.looms:[n],k=lmS.length,idx=Math.max(0,lmS.indexOf(n)),rem=Math.max(0,z.left),gl=glLoom(n,d)||1,pk=surOf(d);
 const totRows=Math.ceil(rem/gl),rows=Math.floor(totRows/k)+(idx<totRows%k?1:0),share=Math.min(rem,rows*gl);
 return{z,k,looms:lmS,rem,totRows,rows,share,gl,pk,pl:rows>0?rollPlanR(rows,gl,pk):[]}}
function rollPlanR(rows,gl,pk){const mx=+S.cfg.rollMax||62.5,maxR=Math.max(1,Math.floor(mx/(pk*gl))),n=Math.max(1,Math.ceil(rows/maxR)),pl=[];let left=rows;for(let i=n;i>0&&left>0;i--){const r=Math.min(maxR,Math.ceil(left/i));pl.push({rows:r,p:r*gl,kg:r*gl*pk});left-=r}return pl}

function tblFilter(id){const t=$('#'+id);if(!t)return;const q=(($('#'+id+'_q')||{}).value||'').trim().toLowerCase(),sel=[...document.querySelectorAll(`[data-ff="${id}"]`)].map(el=>[el.dataset.k,el.value]);let n=0,all=0;

 const st=davState(),ed=isMaster()&&can('davomat'),A=getAtt(st.date,st.sh),W=S.weavers.filter(w=>w.br==BR()&&w.act).sort((a,b)=>A.present.includes(b.id)-A.present.includes(a.id)||a.name.localeCompare(b.name)),secs=mySecs();
 const running=secs.flatMap(loomsOfSec).filter(n=>lm(n).des&&lm(n).act),free=running.filter(n=>!A.map[n]);
 const mine=id=>Object.keys(A.map).filter(n=>A.map[n]==id).map(Number).sort((a,b)=>a-b),bk=id=>sum(S.brak.filter(b=>b.br==BR()&&b.date==st.date&&b.shift==st.sh&&b.wv==id),b=>b.pcs);
 const sel=st.w&&W.find(w=>w.id==st.w),bgCur=bgOn(st.date,st.sh),W1=W.filter(w=>wvBg(w)==bgCur||A.present.includes(w.id)),W2=W.filter(w=>!W1.includes(w));

     <span class="ava" style="width:28px;height:28px;font-size:11px">${initials(w.name)}</span><b style="flex:1;min-width:0">${esc(w.name)}</b><span class="bgb bg${wvBg(w)}" title="${wvBg(w)} smena">${wvBg(w)}</span>

  <div class="chips" style="align-self:flex-end">${['kunduz','tun'].map(s=>`<button class="chip ${st.sh==s?'on':''}" onclick="davState().sh='${s}';render()">${shLbl(st.date,s)}</button>`).join('')}</div><span class="sp"></span>

};
function davP(id,on){if(!isMaster())return;const st=davState(),A=ensureAtt(st.date,st.sh);if(on){if(!A.present.includes(id))A.present.push(id)}else{A.present=A.present.filter(x=>x!=id);Object.keys(A.map).forEach(n=>{if(A.map[n]==id)delete A.map[n]});if(st.w==id)st.w=null}
 logA(`Davomat ${fd(st.date)} ${st.sh}: ${wvObj(id).name} ${on?'smenaga qo\'shildi':'smenadan olindi'}`);save();render()}
function davSet(n,wid){const st=davState(),A=ensureAtt(st.date,st.sh),x=lm(n);
 if(!mySecs().some(s=>n>=s.a&&n<=s.b)){toast(`${n} — bunday stanok yo'q`);return false}
 if(!A.present.includes(wid)){toast('Avval to\'quvchini smenaga qo\'shing (+)');return false}
 if(A.map[n]==wid){delete A.map[n];return true}
 if(Object.values(A.map).filter(v=>v==wid).length>=maxL()){toast(`${wvObj(wid).name}: ko'pi bilan ${maxL()} ta stanok`);return false}
 const old=wvObj(A.map[n]);A.map[n]=wid;if(!x.des)toast(`${n} stanokda dizayn yo'q — baribir biriktirildi`);else if(old)toast(`${n}: ${old.name} → ${wvObj(wid).name}`);return true}
function davAdd(wid,v){const n=parseInt(v,10);if(!n)return;if(davSet(n,wid)){logA(`Davomat: stanok ${n} → ${wvObj(wid).name}`);save();render()}}
function davRem(n){if(!isMaster())return;const st=davState(),A=ensureAtt(st.date,st.sh);delete A.map[n];save();render()}
function davLoom(n){const st=davState();if(!isMaster()||!st.w)return;if(davSet(n,st.w)){save();render()}}
function davCopy(){const st=davState(),prev=getAtt(addD(st.date,-1),st.sh);if(!prev.present.length){toast('Oldingi kunda shu smena davomati yo\'q');return}const A=ensureAtt(st.date,st.sh);A.present=[...prev.present];A.map={...prev.map};A.by=me.name;logA(`Davomat ${fd(st.date)} ${st.sh}: oldingi kundan nusxa olindi`);save();toast('Nusxa olindi — kelmaganlarni − bilan olib tashlang');render()}

 <div class="card"><div class="card-h"><h2>To'quvchilar · ${MON[+m.slice(5)-1]}</h2><span class="sp"></span><span class="m">${W.filter(w=>w.act).length} faol</span></div><div class="tw"><table><thead><tr><th class="l">Ism</th><th>Smena (A/B)</th><th>Ishlagan smena</th><th>Bugun stanok</th><th>Kg</th><th>Dona</th><th>Brak</th><th>Brak %</th><th class="l">Holat</th></tr></thead><tbody>${W.map(w=>{const sm=Object.entries(S.att).filter(([k,a])=>k.startsWith(BR()+'|'+m)&&a.present.includes(w.id)).length,tl=['kunduz','tun'].map(s=>Object.values(getAtt(TODAY(),s).map).filter(x=>x==w.id).length).reduce((a,b)=>a+b,0),vs=valsBr().filter(v=>v.weaver==w.name&&vM(v)==m),pc=sum(vs,v=>v.pcs),bk=sum(S.brak.filter(b=>b.wv==w.id&&monthOf(b.date)==m),b=>b.pcs);

function addWv(toShift){const n=$('#wvn').value.trim();if(!n)return;if(S.weavers.some(w=>w.br==BR()&&w.name.toLowerCase()==n.toLowerCase())){toast('Bunday to\'quvchi bor');return}const w={id:uid(),br:BR(),name:n,act:true,bg:toShift?bgOn(davState().date,davState().sh):'A'};S.weavers.push(w);if(toShift){const st=davState(),A=ensureAtt(st.date,st.sh);A.present.push(w.id);st.w=w.id}logA('Yangi to\'quvchi: '+n);save();toast(n+' qo\'shildi');render()}

/* ---------- ARXIV va EXCEL ---------- */
function inFrame(){try{return window.self!==window.top}catch(e){return true}}
function dlBook(wb,name){if(!window.XLSX){toast('Excel kutubxonasi yuklanmadi (internet kerak)');return}
 if(inFrame()){toast('Bu oynada fayl yuklab olinmaydi — faylni kompyuterda brauzerda oching');return}
 XLSX.writeFile(wb,name);logA('Excel yuklab olindi: '+name);save()}
function perRows(m){return valsBr().filter(v=>vM(v)==m).sort((a,b)=>a.loom-b.loom||(a.date<b.date?-1:a.date>b.date?1:0)).map(v=>{const c=calc(v),d=desObj(v.des)||{};return{'ID':v.id,'Stanok':v.loom,'Val':v.code,'Sana':v.date,'Smena':v.shift,'Dizayn':d.name||'','Zakazchik':d.cust||'','Grammaj m²':d.gsm||'','Norma kg':+kgN(c.norm).replace(',','.'),'Glatka':v.gl,'Tarozi kg':v.brutto,'Tara':v.tara||0,'Glatka soni':v.gs,'KG':+c.net.toFixed(1),'Dona':c.pcs,'Brak':v.brak||0,'1 dona kg':+c.gram.toFixed(4),'Farq':c.farq!=null?+c.farq.toFixed(4):'','%':c.pc!=null?Math.round(c.pc):'','Razmer':v.size||0,"To'quvchi":v.weaver||'','Holat':VST[v.st][0]}})}

 const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=Object.keys(rows[0]||{}).map(k=>({wch:k=='ID'?10:k=='Dizayn'?22:11}));XLSX.utils.book_append_sheet(wb,ws,'Perixod');
 const days=new Date(+m.slice(0,4),+m.slice(5),0).getDate(),looms=[...new Set(rows.map(r=>r.Stanok))];
 const ton=looms.map(n=>{const o={'Stanok':n};let tot=0;for(let d=1;d<=days;d++){const ds=m+'-'+String(d).padStart(2,'0'),k=+sum(rows.filter(r=>r.Stanok==n&&r.Sana==ds),r=>r.KG).toFixed(1);o[d]=k||'';tot+=k}o['Итог']=+tot.toFixed(1);return o});
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ton),'ТОННА');

function importPer(input){const f=input.files&&input.files[0];if(!f)return;if(!window.XLSX){toast('Excel kutubxonasi yuklanmadi');return}
 const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),rows=impRows(wb);if(!rows.length){toast('Faylda perixod topilmadi: saytdan yuklab olingan perixod Excelini tuzatib yuklang');return}
  const F=[['Tarozi kg','brutto',1],['Tara','tara',1],['Glatka','gl',1],['Glatka soni','gs',1],['Razmer','size',1],["To'quvchi",'weaver',0],['Dizayn','des',0]],diff=[];let miss=0;
  rows.forEach(row=>{const v=S.vals.find(x=>x.id==row.ID&&x.br==BR());if(!v){miss++;return}const ch=[];
   F.forEach(([col,k,num])=>{if(!(col in row))return;let nv=row[col];if(k=='des'){const d=S.designs.find(x=>x.br==BR()&&x.name==String(nv).trim());if(!d||d.id==v.des)return;ch.push({k,col,old:(desObj(v.des)||{}).name,nv:d.name,val:d.id});return}
    if(num){nv=parseFloat(String(nv).replace(',','.'))||0;if(Math.abs(nv-(+v[k]||0))<1e-9)return}else{nv=String(nv??'').trim();if(nv==String(v[k]??''))return}ch.push({k,col,old:v[k],nv,val:nv})});
   if(ch.length)diff.push({id:v.id,code:v.code,date:v.date,ch,locked:v.st!='free'})});
  ui.modal={k:'imp',name:f.name,diff,miss,total:rows.length};render()}catch(err){toast('Faylni o\'qib bo\'lmadi: '+err.message)}};r.readAsArrayBuffer(f);input.value=''}
function applyImp(){const M=ui.modal;let n=0;M.diff.forEach(d=>{const v=S.vals.find(x=>x.id==d.id);if(!v)return;d.ch.forEach(c=>{v[c.k]=c.val});v.pcs=(+v.gl||0)*(+v.gs||0);n++;logA(`Excel tuzatish: val ${v.code} (${d.ch.map(c=>c.col+': '+c.old+' → '+c.nv).join(', ')})`)});
 notify(BR(),['planner','boss'],`${me.name} Exceldan ${n} ta perixod valini tuzatdi (${M.name})`,'warn');ui.modal=null;checkAll();save();toast(`${n} ta val yangilandi`);render()}

 <div class="m">${esc(M.name)} · ${M.total} qator o'qildi · ${M.diff.length} ta valda o'zgarish${M.miss?` · ${M.miss} qator ID bo'yicha topilmadi`:''}</div>

 ${M.diff.some(d=>d.locked)?'<div class="notice warn">Ba\'zi vallar allaqachon pasportda — o\'zgarish pasport hisobiga ham ta\'sir qiladi.</div>':''}

VIEWS.arch=()=>{const M=monthsOf(),cx=can('excel')||rank(me.role)<=3,co=can('oy');
 return `<div class="card"><h2>Arxiv va Excel</h2>${archAuto()}<p class="m" style="margin:6px 0 0">${S.cfg.autoMonth!==false?'Har oy oxirida perixod va rasxod avtomatik yakunlanadi.':'Avto yakunlash o\'chirilgan: perixod yoki rasxod «Oyni yakunlash»ni bosadi, rejalashtirish tasdiqlaydi.'} Istalgan oyni Excelga yuklab olib ko'rish mumkin. Perixod Excel eski fayl ko'rinishida yuklanadi: СТ, Номенклатура, JAMI ZAKAZ, ТОННА va har stanok alohida varaqda, formulalar va ranglar bilan. Undagi tarozi, tara, glatka, razmer, to'quvchi yoki dizaynni tuzatib qaytarib yuklasangiz, o'zgarishlar ko'rsatiladi va tasdiqlagach saytga tushadi.</p>
  ${cx?`<div class="row" style="margin-top:12px"><label class="btn" for="impF">${ic('up')} Tuzatilgan perixod Excelini yuklash</label><input type="file" id="impF" accept=".xlsx,.xls" hidden onchange="importPer(this)"></div>`:''}</div>
 ${M.map(m=>{const V=valsBr().filter(v=>vM(v)==m),P=S.passes.filter(p=>p.br==BR()&&p.month==m&&p.st!='draft'),o=S.months[BR()+'|'+m]||{},cur=m==monthOf(TODAY());
  const st=k=>o[k]?`<span class="pill ok">yakunlangan · ${o[k].auto?'avto':esc(o[k].by)} · ${esc(o[k].t)}</span>${co&&rank(me.role)<=2?` <button class="btn sm ghost" onclick="reopen('${k}','${m}')">Qayta ochish</button>`:''}`:o[k+'Req']?`<span class="pill warn">yakunlash so'ralgan · ${esc(o[k+'Req'].by)}</span>${canApr()?` <button class="btn sm t" onclick="aprMonth('${k}','${m}',1)">Tasdiqlash</button> <button class="btn sm" onclick="aprMonth('${k}','${m}',0)">Rad etish</button>`:''}`:`<span class="pill warn">ochiq${cur?' (joriy oy)':''}</span>`;
  return `<div class="card"><div class="card-h"><h2>${MON[+m.slice(5)-1]} ${m.slice(0,4)}</h2></div><div class="grid g2">
   <div class="card" style="background:var(--surface2)"><div class="row"><b>Perixod</b><span class="sp"></span>${st('per')}</div><div class="num" style="font-size:20px;font-weight:600;margin:8px 0">${N(sum(V,v=>calc(v).net)/1000,2)} t · ${V.length} val</div><div class="m" style="font-size:12.5px">${N(sum(V,v=>v.pcs),0)} dona · brak ${N(sum(V,v=>v.brak),0)}</div>${cx?`<button class="btn sm" style="margin-top:10px" onclick="exportPer('${m}')">${ic('down')} Perixod Excel</button>`:''} <button class="btn sm" style="margin-top:10px" onclick="ui.archM=ui.archM=='${m}'?null:'${m}';ui.archL='';render()">${ui.archM==m?'Yopish':'Saytda ko\'rish'}</button></div>
   <div class="card" style="background:var(--surface2)"><div class="row"><b>Rasxod</b><span class="sp"></span>${st('rx')}</div><div class="num" style="font-size:20px;font-weight:600;margin:8px 0">${N(sum(P,p=>pTotals(p).kg)/1000,2)} t · ${P.length} pasport</div><div class="m" style="font-size:12.5px">${sum(P,p=>p.vals.length)} val · qabul ${P.filter(p=>p.st=='recv').length}</div>${cx?`<button class="btn sm" style="margin-top:10px" onclick="exportRx('${m}')">${ic('down')} Rasxod Excel</button>`:''}</div></div>${ui.archM==m?archView(m):''}</div>`}).join('')||'<div class="empty">Hali ma\'lumot yo\'q</div>'}`};

VIEWS.rep=()=>{
 const t=TODAY(),m=monthOf(t),per={today:[t,t,'Bugun'],week:[addD(t,-6),t,'7 kun'],month:[m+'-01',t,'Bu oy'],prev:(()=>{const d=new Date(t+'T12:00');d.setDate(0);const e=ymd(d);return[e.slice(0,7)+'-01',e,'O\'tgan oy']})()}[ui.rep];
 const V=valsBr().filter(v=>v.date>=per[0]&&v.date<=per[1]&&(ui.repSec=='all'||v.sec==ui.repSec));
 const kg=sum(V,v=>calc(v).net),pcs=sum(V,v=>v.pcs),br=sum(V,v=>v.brak);
 const days=[];for(let d=per[0];d<=per[1];d=addD(d,1))days.push([d,sum(V.filter(v=>v.date==d),v=>calc(v).net)]);
 const by=(f)=>{const o={};V.forEach(v=>{const k=f(v);o[k]=o[k]||{kg:0,pcs:0,br:0,n:0};o[k].kg+=calc(v).net;o[k].pcs+=v.pcs;o[k].br+=v.brak;o[k].n++});return Object.entries(o).sort((a,b)=>b[1].kg-a[1].kg)};
 const P=S.passes.filter(p=>p.br==BR()&&p.st!='draft'&&p.date>=per[0]&&p.date<=per[1]);
 const tbl=(rows,h)=>`<div class="tw"><table><thead><tr><th class="l">${h}</th><th>Val</th><th>Kg</th><th>Dona</th><th>Brak</th><th>Brak %</th></tr></thead><tbody>${rows.map(([k,o])=>`<tr><td class="l">${esc(k)}</td><td class="num">${o.n}</td><td class="num">${N(o.kg,1)}</td><td class="num">${N(o.pcs,0)}</td><td class="num">${N(o.br,0)}</td><td class="num">${N(o.pcs?o.br/(o.pcs+o.br)*100:0,2)}</td></tr>`).join('')||'<tr><td class="l m" colspan="6">Ma\'lumot yo\'q</td></tr>'}</tbody></table></div>`;
 return `<div class="row"><div class="chips">${[['today','Bugun'],['week','7 kun'],['month','Bu oy'],['prev','O\'tgan oy']].map(([k,l])=>`<button class="chip ${ui.rep==k?'on':''}" onclick="ui.rep='${k}';render()">${l}</button>`).join('')}</div><span class="sp"></span><select class="in" style="width:auto" aria-label="Bo'lim" onchange="ui.repSec=this.value;render()"><option value="all">Barcha stanoklar</option>${secsOf(BR()).map(s=>`<option value="${s.id}" ${ui.repSec==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
 <div class="kpis"><div class="kpi tilt"><div class="lbl">Perixod</div><div class="v">${N(kg,1)}<small>kg</small></div><div class="s">${V.length} val · ${fd(per[0])} – ${fd(per[1])}</div></div>
 <div class="kpi tilt" style="--k:var(--violet)"><div class="lbl">Dona</div><div class="v">${N(pcs,0)}</div><div class="s">o'rtacha ${pcs?N(kg*1000/pcs,0):'—'} g</div></div>
 <div class="kpi tilt" style="--k:var(--bad)"><div class="lbl">Brak</div><div class="v">${N(br,0)}<small>dona</small></div><div class="s">${N(pcs?br/(pcs+br)*100:0,2)}%</div></div>
 <div class="kpi tilt" style="--k:var(--teal)"><div class="lbl">Rangxonaga</div><div class="v">${N(sum(P,p=>pTotals(p).kg),1)}<small>kg</small></div><div class="s">${P.length} pasport · qabul ${N(sum(P.filter(p=>p.st=='recv'),p=>pTotals(p).rec),1)} kg</div></div></div>
 ${days.length>1?`<div class="card"><div class="card-h"><h2>Kunlar bo'yicha, kg</h2></div>${barChart(days)}</div>`:''}
 <div class="grid g2"><div class="card"><div class="card-h"><h2>Dizayn bo'yicha</h2></div>${tbl(by(v=>(desObj(v.des)||{}).name||'—'),'Dizayn')}</div>
 <div class="card"><div class="card-h"><h2>To'quvchilar</h2></div>${tbl(by(v=>v.weaver||'—'),'To\'quvchi')}</div></div>
 <div class="card"><div class="card-h"><h2>Stanoklar (eng ko'p kg)</h2></div>${tbl(by(v=>'Stanok '+v.loom).slice(0,15),'Stanok')}</div>`;
};

 if(S.users.some(u=>u.u==login&&u.id!=id)){toast('Bu login band');return}if((id=='new'||pw)&&pw.length<6){toast('Parol kamida 6 belgi bo\'lsin');return}
 if(rank(role)<=rank(me.role)){toast('Bu lavozimni bera olmaysiz');return}
 const perms=$$('input[name=uperm]:checked').map(x=>x.value).filter(p=>ROLE_ALLOW[role].includes(p)),secs=[];
 let u;if(id=='new'){u={id:uid(),act:true,by:me.name,t:nowS()};S.users.push(u)}else u=S.users.find(x=>x.id==id);

 const w=+f.w.value||'',g=+f.g.value||'',mo=f.mo.value.trim()||DEF_MODEL;S.sections.push({id:uid(),br,name:n,a,b});for(let i=a;i<=b;i++)S.lm[br+':'+i]=S.lm[br+':'+i]||{type:defType(i),des:'',act:true,w,gl:g,model:mo};logA(`Stanoklar qo'shildi: ${a}–${b}${w?', eni '+w:''}${g?', glatka '+g:''}`);save();render()}

/* ================= v2.16: o'chirish / tahrirlash yetishmagan joylar ================= */
/* Filial: nomini o'zgartirish va (ishlatilmagan bo'lsa) o'chirish */
function brUse(id){const n={val:S.vals.filter(v=>v.br==id).length,pas:S.passes.filter(p=>p.br==id||pSrc(p)==id||p.to==id).length,diz:S.designs.filter(d=>d.br==id).length,xod:S.users.filter(u=>u.br==id).length,toq:S.weavers.filter(w=>w.br==id).length,brak:S.brak.filter(b=>b.br==id).length,zak:(S.transfers||[]).filter(t=>t.from==id||t.to==id).length};n.tot=Object.values(n).reduce((a,b)=>a+b,0);return n}
function brUseTxt(n){return[['val','val'],['pas','pasport'],['diz','dizayn'],['xod','xodim'],['toq',"to'quvchi"],['brak','brak'],['zak','zakaz o\'tkazmasi']].filter(([k])=>n[k]).map(([k,l])=>n[k]+' '+l).join(', ')}
function brTools(b){const n=brUse(b.id),main=b.id==skBr();
 return `<input class="in" style="width:auto;min-width:150px;padding:5px 8px" value="${esc(b.name)}" aria-label="Filial nomi" onchange="renBr('${b.id}',this.value)">${main?'<span class="pill a" title="Jar sklad shu filialda — o\'chirilmaydi">asosiy</span>':n.tot?`<span class="m" style="font-size:12px" title="Avval bularni o'chiring yoki boshqa filialga o'tkazing">o'chirib bo'lmaydi: ${esc(brUseTxt(n))}</span>`:delBtn('br'+b.id,`delBr('${b.id}')`,'Filialni o\'chirish')}`}
function renBr(id,v){const b=S.branches.find(x=>x.id==id),n=(v||'').trim();if(!b||!can('filial'))return;if(!n){toast('Filial nomini kiriting');render();return}if(S.branches.some(x=>x.id!=id&&x.name.toLowerCase()==n.toLowerCase())){toast('Bunday filial bor');render();return}const o=b.name;b.name=n;logA(`Filial nomi: ${o} → ${n}`);save();render()}
function delBr(id){if(!can('filial'))return;const b=S.branches.find(x=>x.id==id);if(!b)return;if(id==skBr()||brUse(id).tot){toast('Bu filialni o\'chirib bo\'lmaydi');ui.confirm=null;render();return}
 S.branches=S.branches.filter(x=>x.id!=id);S.sections=S.sections.filter(s=>s.br!=id);Object.keys(S.lm).forEach(k=>{if(k.startsWith(id+':'))delete S.lm[k]});
 if(S.acl)Object.keys(S.acl).forEach(k=>{if(k.startsWith(id+'|'))delete S.acl[k]});Object.keys(S.att||{}).forEach(k=>{if(k.startsWith(id+'|'))delete S.att[k]});
 S.branches.forEach(x=>{if(x.rxTo==id)x.rxTo=x.id});if(ui.br==id)ui.br=(S.branches[0]||{}).id;ui.confirm=null;logA(`Filial o'chirildi: ${b.name}`);save();toast(b.name+' filiali o\'chirildi');render()}
/* Perixod: xato kiritilgan valni o'chirish (pasportga kirmagan, oy yopilmagan) */
function canDelVal(v){if(!v||v.pass||v.st=='pass'||isClosed('per',vM(v)))return false;if(can('per_tahrir'))return v.st=='free'||v.st=='rx';return canEditVal(v)}
function delVal(id){const v=S.vals.find(x=>x.id==id);if(!canDelVal(v)){toast('Bu valni o\'chirib bo\'lmaydi (pasportga kirgan yoki oy yopilgan)');ui.confirm=null;render();return}
 S.vals=S.vals.filter(x=>x.id!=id);S.brak.forEach(b=>{if(b.val==id)b.val=null});(S.issues||[]).forEach(I=>{if(I.val==id)I.val=null});
 logA(`Val o'chirildi: ${v.code} (stanok ${v.loom}, ${N(calc(v).net,1)} kg)`);ui.edit=null;ui.confirm=null;save();toast(`Val ${v.code} o'chirildi`);render()}
/* To'quvchi: hech qayerda ishlatilmagan bo'lsa o'chirish */
function wvUsed(id){const w=wvObj(id);if(!w)return true;return Object.values(S.att||{}).some(a=>(a.present||[]).includes(id)||Object.values(a.map||{}).includes(id))||S.brak.some(b=>b.wv==id)||S.vals.some(v=>v.weaver==w.name&&v.br==w.br)}
function delWv(id){const w=wvObj(id);if(!w||wvUsed(id)){toast('Bu to\'quvchi davomat yoki brakda bor — «Bo\'shagan» qiling');ui.confirm=null;render();return}S.weavers=S.weavers.filter(x=>x.id!=id);ui.confirm=null;logA(`To'quvchi o'chirildi: ${w.name}`);save();render()}
/* Boshqa filialga yuborilgan zakazni (hali qabul qilinmagan) bekor qilish */
TRS.cancel=['bekor qilindi','n'];
function trCancel(id){if(!can('zakaz'))return;const t=(S.transfers||[]).find(x=>x.id==id);if(!t||t.st!='sent'){ui.confirm=null;render();return}t.st='cancel';t.acc={by:me.name,t:nowS()};notify(t.to,['planner','boss'],`${brObj(t.from).name} zakaz o'tkazmasini bekor qildi: ${t.snap.name} ${t.rang||''} ${N(t.qty,0)} dona`,'warn');logA(`Zakaz o'tkazmasi bekor qilindi: ${t.snap.name}`);ui.confirm=null;save();render()}

 return `<details class="hitem" ${open?'open':''}><summary>${esc(it.q)}</summary>${st}${it.tip?`<div class="notice a hn"><div>💡 ${esc(it.tip)}</div></div>`:''}${it.go&&helpGo(it.go)?`<button class="btn sm" onclick="go('${it.go}')">${esc(TITLES[it.go]||it.go)} bo'limiga o'tish →</button>`:''}</details>`}

 if(q){const R=[];HELP.forEach(S=>S.it.forEach(it=>{if((it.q+' '+it.s.join(' ')+' '+(it.tip||'')).toLowerCase().includes(q))R.push([S,it])}));
  return R.length?`<div class="m" style="margin-bottom:8px">«${esc(ui.hq)}» bo'yicha ${R.length} ta topildi</div>`+R.map(([S,it])=>`<div class="hfrom">${esc(S.t)}</div>${helpItem(it,true)}`).join(''):`<div class="empty">Topilmadi. Boshqa so'z bilan qidirib ko'ring.</div>`}
 const S=HELP.find(x=>x.id==helpSec())||HELP[0];return `<div class="hhead"><h2>${esc(S.t)}</h2><p class="m">${esc(S.d)}</p></div>`+S.it.map((it,i)=>helpItem(it,i==0)).join('')}
